[project]
name = "distance-frame-annotator"
version = "0.2.1"
description = "Distance-bin sampling and pixel-level GT annotation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "opencv-contrib-python==4.10.0.84", "Pillow>=10,<13"]
[project.scripts]
distance-annotator = "distance_frame_annotator.integrated:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/distance_frame_annotator", "src/pixel_annotator"]
[dependency-groups]
dev = ["pytest>=8,<10"]
